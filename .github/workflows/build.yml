name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -c 200000 build-output.log > ci-last-failure.log || true
          fi
          exit "$status"

      - name: Verify jar exists
        run: ls -la build/libs/tornadic-1.0.0.jar

      - name: Runtime smoke test (headless dedicated server)
        if: success()
        run: |
          set -x
          # Loom 1.17 dev runServer working directory is <project>/run.
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          {
            echo 'online-mode=false'
            echo 'enable-rcon=true'
            echo 'rcon.password=tornadic'
            echo 'rcon.port=25575'
            echo 'max-tick-time=60000'
            echo 'spawn-protection=0'
            echo 'view-distance=4'
            echo 'simulation-distance=4'
            echo 'generate-structures=false'
            echo 'level-seed=987654321'
            echo 'motd=tornadic-ci'
          } > run/server.properties

          # Split source sets make loom prefix the run task per mod (e.g. tornadic_runServer).
          ./gradlew tasks --all --no-daemon > gradle-tasks.log 2>&1 || true
          TASK=$(grep -oE '[a-zA-Z_]*runServer' gradle-tasks.log | head -1)
          [ -n "$TASK" ] || TASK=runServer
          echo "run-server task: $TASK"

          ./gradlew "$TASK" --no-daemon > gradle-server.log 2>&1 &
          GRADLE_PID=$!

          # Wait for the RCON port (world generation on first boot takes a while).
          READY=0
          for i in $(seq 1 75); do
            if python3 ci/rcon_test.py 127.0.0.1 25575 tornadic list > rcon-list.out 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "SERVER NEVER BECAME READY"
            tail -c 100000 gradle-server.log > ci-last-failure.log || true
            tail -c 100000 run/latest.log >> ci-last-failure.log 2>/dev/null || true
            pkill -f KnotServer 2>/dev/null || true
            pkill -f GradleDaemon 2>/dev/null || true
            kill "$GRADLE_PID" 2>/dev/null || true
            exit 1
          fi

          run_cmd() {
            local name="$2"
            echo "\$ /$1"
            python3 ci/rcon_test.py 127.0.0.1 25575 tornadic "$1" > "rcon-out-${name}.out" 2>&1 || echo "(command failed: $1)"
            cat "rcon-out-${name}.out" 2>/dev/null || true
            sleep 2
          }

          run_cmd "thermos" thermos
          run_cmd "thermos tomorrow" thermos_tomorrow
          run_cmd "spawn_tornado ef2" spawn_tornado
          run_cmd "tornado_info" tornado_info_1
          run_cmd "storm_info" storm_info
          run_cmd "weatherstorm supercell" weatherstorm
          sleep 20
          run_cmd "tornado_info" tornado_info_2
          python3 ci/rcon_test.py 127.0.0.1 25575 tornadic stop || true

          # Wait for a clean shutdown (max 90s).
          for i in $(seq 1 45); do
            if ! pgrep -f KnotServer > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          pkill -f KnotServer 2>/dev/null || true
          kill "$GRADLE_PID" 2>/dev/null || true
          pkill -f GradleDaemon 2>/dev/null || true
          sleep 2

          echo "=== rcon outputs ==="
          cat rcon-list.out
          echo "=== server log assertions ==="
          [ -f run/latest.log ] || { echo "NO LATEST LOG"; find . -name "latest.log" 2>/dev/null | head; ls -la run 2>/dev/null || true; exit 1; }
          FAIL=0
          grep -q "Tornadic loaded" run/latest.log || { echo "FAIL: mod never initialized"; FAIL=1; }
          if grep -q "Crashed server" run/latest.log; then echo "FAIL: server crashed"; FAIL=1; fi
          if grep -q "Tornadic simulation tick failed" run/latest.log; then echo "FAIL: simulation tick exception"; FAIL=1; fi
          if grep -q "THERMOS" rcon-out-thermos.out 2>/dev/null; then echo "OK: /thermos produced output"; else echo "FAIL: no /thermos output"; FAIL=1; fi
          if grep -q "unknown command" rcon-out-thermos.out 2>/dev/null; then echo "FAIL: /thermos unknown command"; FAIL=1; fi
          if [ "$FAIL" != "0" ]; then
            {
              echo "=== runtime smoke test FAILED $(date -u) ==="
              for f in rcon-*.out; do echo "--- $f ---"; cat "$f" 2>/dev/null || true; done
              echo "--- latest.log tail ---"; tail -c 120000 run/latest.log 2>/dev/null || true
              echo "--- gradle-server.log tail ---"; tail -c 60000 gradle-server.log 2>/dev/null || true
            } > ci-last-failure.log
            exit 1
          fi
          echo "RUNTIME SMOKE TEST PASSED"

      - name: Remove stale failure log
        if: success()
        run: |
          set +e
          git config user.name "tornadic-ci"
          git config user.email "ci@tornadic.invalid"
          if [ -f ci-last-failure.log ]; then
            rm ci-last-failure.log
            git add -A ci-last-failure.log
          fi
          if ! git diff --cached --quiet; then
            git commit -m "ci: build fixed, drop diagnostic logs"
            git push
          fi
          exit 0

      - name: Commit failure log
        if: failure()
        run: |
          set +e
          git config user.name "tornadic-ci"
          git config user.email "ci@tornadic.invalid"
          [ -f ci-last-failure.log ] || echo "BUILD STEP DIED BEFORE CAPTURE" > ci-last-failure.log
          KEY=$(grep -E "error|Error|ERROR|FAILED|What went wrong|Exception" ci-last-failure.log | head -5 | tr '\n' '|' | head -c 150)
          git add -f ci-last-failure.log
          COMMITTED=0
          if ! git diff --cached --quiet; then
            if git commit -m "ci: last build failure log | ${KEY}"; then
              COMMITTED=1
            fi
          fi
          if [ "$COMMITTED" = "1" ]; then
            git push > /tmp/push.out 2>&1
            PUSH=$?
            echo "push-exit=$PUSH $(head -c 300 /tmp/push.out)"
            if [ "$PUSH" -ne 0 ]; then
              echo "PUSH_DENIED - log could not be committed"
              exit 1
            fi
          fi
          exit 0

      - name: Upload mod jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tornadic-1.0.0
          path: build/libs/tornadic-1.0.0.jar
