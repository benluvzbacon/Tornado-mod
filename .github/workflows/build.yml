name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          set +e
          ./gradlew --version 2>&1 | tee -a build-output.log
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee -a build-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            tail -c 200000 build-output.log > ci-last-failure.log
            exit "$status"
          fi

      - name: Verify jar exists
        run: ls -la build/libs/tornadic-1.0.0.jar

      - name: Remove stale failure log
        if: success()
        run: |
          git config user.name "tornadic-ci"
          git config user.email "ci@tornadic.invalid"
          if [ -f ci-last-failure.log ]; then
            rm ci-last-failure.log
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "ci: build fixed, drop last failure log"
              git push || true
            fi
          fi

      - name: Commit failure log
        if: failure()
        run: |
          git config user.name "tornadic-ci"
          git config user.email "ci@tornadic.invalid"
          git add ci-last-failure.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: last build failure log"
            git push || true
          fi
          # Fallback: also post the log as a commit comment so it is always visible.
          if [ -f ci-last-failure.log ]; then
            python3 - "$GITHUB_TOKEN" "$GITHUB_REPOSITORY" "$GITHUB_SHA" <<'PYEOF' || true
import json, sys, urllib.request
token, repo, sha = sys.argv[1], sys.argv[2], sys.argv[3]
body = open("ci-last-failure.log", "r", errors="replace").read()[:50000]
req = urllib.request.Request(
    f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
    data=json.dumps({"body": "CI build failed. Log tail:\n\n```log\n" + body + "\n```"}).encode(),
    headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
             "User-Agent": "tornadic-ci"},
    method="POST")
try:
    urllib.request.urlopen(req, timeout=60)
except Exception as e:
    print("commit comment failed:", e)
PYEOF
          fi

      - name: Upload mod jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tornadic-1.0.0
          path: build/libs/tornadic-1.0.0.jar
