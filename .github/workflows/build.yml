name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -c 200000 build-output.log > ci-last-failure.log || true
          fi
          exit "$status"

      - name: Verify distributable jar contents
        run: |
          JAR=build/libs/tornadic-2.0.0.jar
          ls -la "$JAR"
          # Prevent a server-only smoke test from overlooking a broken client entrypoint.
          unzip -l "$JAR" | grep -q 'com/tornadic/client/TornadicClientMod.class'
          unzip -p "$JAR" fabric.mod.json | grep -q 'com.tornadic.client.TornadicClientMod'

      - name: Runtime smoke test (headless dedicated server)
        if: success()
        run: |
          set -x
          # Loom 1.17 dev runServer: working directory = <project>/run and the
          # server console reads gradle's stdin (loom AbstractProductionRunTask).
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          {
            echo 'online-mode=false'
            echo 'max-tick-time=60000'
            echo 'spawn-protection=0'
            echo 'view-distance=4'
            echo 'simulation-distance=4'
            echo 'generate-structures=false'
            echo 'level-seed=987654321'
            echo 'motd=tornadic-ci'
          } > run/server.properties

          ./gradlew tasks --all --no-daemon > gradle-tasks.log 2>&1 || true
          TASK=$(grep -oE '[a-zA-Z_]*runServer' gradle-tasks.log | head -1)
          [ -n "$TASK" ] || TASK=runServer
          echo "run-server task: $TASK"

          # Console commands piped through a FIFO (kept open so the server never sees EOF).
          rm -f /tmp/telemetry-fifo && mkfifo /tmp/telemetry-fifo
          exec 3<>/tmp/telemetry-fifo
          ./gradlew "$TASK" --no-daemon > gradle-server.log 2>&1 < /tmp/telemetry-fifo &
          GRADLE_PID=$!

          READY=0
          for i in $(seq 1 90); do
            if grep -q "Done (" gradle-server.log 2>/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "SERVER NEVER BECAME READY"
            {
              echo "=== runtime smoke test FAILED: server never ready $(date -u) ==="
              echo "--- gradle-server.log tail ---"; tail -c 100000 gradle-server.log 2>/dev/null || true
            } > ci-last-failure.log
            pkill -f KnotServer 2>/dev/null || true
            kill "$GRADLE_PID" 2>/dev/null || true
            pkill -f GradleDaemon 2>/dev/null || true
            exec 3>&-
            exit 1
          fi
          sleep 3

          send_cmd() {
            echo "\$ $1"
            echo "$1" >&3
            sleep 5
          }

          send_cmd list
          send_cmd thermos
          send_cmd "thermos tomorrow"
          send_cmd "spawn_tornado"
          send_cmd tornado_info
          send_cmd storm_info
          send_cmd "weatherstorm supercell"
          send_cmd "thermos debug simtick 2000"
          send_cmd "spawn_tornado ef5"
          send_cmd tornado_info
          send_cmd storm_info
          echo "stop" >&3
          echo "stop sent"

          for i in $(seq 1 60); do
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          pkill -f KnotServer 2>/dev/null || true
          kill "$GRADLE_PID" 2>/dev/null || true
          pkill -f GradleDaemon 2>/dev/null || true
          exec 3>&-
          sleep 2

          echo "=== server log assertions ==="
          SERVER_LOG=gradle-server.log
          [ -f run/latest.log ] && SERVER_LOG=run/latest.log
          echo "asserting against $SERVER_LOG"
          FAIL=0
          grep -q "Tornadic loaded" "$SERVER_LOG" || { echo "FAIL: mod never initialized"; FAIL=1; }
          if grep -q "Crashed server" "$SERVER_LOG"; then echo "FAIL: server crashed"; FAIL=1; fi
          if grep -q "Tornadic simulation tick failed" "$SERVER_LOG"; then echo "FAIL: simulation tick exception"; FAIL=1; fi
          if grep -q "THERMOS" "$SERVER_LOG"; then echo "OK: /thermos output present"; else echo "FAIL: no /thermos output"; FAIL=1; fi
          if grep -q "forced simulation ticks" "$SERVER_LOG"; then echo "OK: forced simulation tick ran"; else echo "FAIL: simtick never ran"; FAIL=1; fi
          if grep -q "Spawned EF2 tornado with tornadic supercell" "$SERVER_LOG"; then echo "OK: default /spawn_tornado created EF2"; else echo "FAIL: default tornado command did not create EF2"; FAIL=1; fi
          if grep -q "Spawned EF5 tornado with tornadic supercell" "$SERVER_LOG"; then echo "OK: explicit EF5 tornado created"; else echo "FAIL: explicit EF5 command failed"; FAIL=1; fi
          grep "forced simulation ticks" "$SERVER_LOG" | tail -n 1
          if [ "$FAIL" != "0" ]; then
            {
              echo "=== runtime smoke test FAILED $(date -u) ==="
              echo "--- server log tail ---"; tail -c 120000 "$SERVER_LOG" 2>/dev/null || true
            } > ci-last-failure.log
            exit 1
          fi
          echo "RUNTIME SMOKE TEST PASSED"

      - name: Remove stale failure log
        if: success()
        run: |
          set +e
          git config user.name "tornadic-ci"
          git config user.email "ci@tornadic.invalid"
          if [ -f ci-last-failure.log ]; then
            rm ci-last-failure.log
            git add -A ci-last-failure.log
          fi
          if ! git diff --cached --quiet; then
            git commit -m "ci: build fixed, drop diagnostic logs"
            git push
          fi
          exit 0

      - name: Commit failure log
        if: failure()
        run: |
          set +e
          git config user.name "tornadic-ci"
          git config user.email "ci@tornadic.invalid"
          [ -f ci-last-failure.log ] || {
            echo "BUILD OR SMOKE STEP DIED BEFORE CAPTURE" > ci-last-failure.log
            tail -c 100000 gradle-server.log >> ci-last-failure.log 2>/dev/null || true
          }
          KEY=$(grep -E "error|Error|ERROR|FAILED|What went wrong|Exception" ci-last-failure.log | head -5 | tr '\n' '|' | head -c 150)
          git add -f ci-last-failure.log
          COMMITTED=0
          if ! git diff --cached --quiet; then
            if git commit -m "ci: last build failure log | ${KEY}"; then
              COMMITTED=1
            fi
          fi
          if [ "$COMMITTED" = "1" ]; then
            git push > /tmp/push.out 2>&1
            PUSH=$?
            echo "push-exit=$PUSH $(head -c 300 /tmp/push.out)"
            if [ "$PUSH" -ne 0 ]; then
              echo "PUSH_DENIED - log could not be committed"
              exit 1
            fi
          fi
          exit 0

      - name: Upload mod jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tornadic-2.0.0
          path: build/libs/tornadic-2.0.0.jar
