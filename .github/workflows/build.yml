name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          set +e
          ./gradlew --version 2>&1 | tee -a build-output.log
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee -a build-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            tail -c 200000 build-output.log > ci-last-failure.log
            exit "$status"
          fi

      - name: Verify jar exists
        run: ls -la build/libs/tornadic-1.0.0.jar

      - name: Remove stale failure log
        if: success()
        run: |
          git config user.name "tornadic-ci"
          git config user.email "ci@tornadic.invalid"
          if [ -f ci-last-failure.log ]; then
            rm ci-last-failure.log
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "ci: build fixed, drop last failure log"
              git push || true
            fi
          fi

      - name: Commit failure log
        if: failure()
        run: |
          git config user.name "tornadic-ci"
          git config user.email "ci@tornadic.invalid"
          git add ci-last-failure.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: last build failure log"
            git push || true
          fi
          # Fallback: also post the log as a commit comment so it is always visible.
          if [ -f ci-last-failure.log ]; then
            LOG_B64=$(base64 -w0 ci-last-failure.log | head -c 45000)
            curl -sS -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"body\": \"CI build failed. Log tail (base64): ${LOG_B64}\"}" || true
          fi

      - name: Upload mod jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tornadic-1.0.0
          path: build/libs/tornadic-1.0.0.jar
