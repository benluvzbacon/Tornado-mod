name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -c 200000 build-output.log > ci-last-failure.log || true
          fi
          exit "$status"

      - name: Verify jar exists
        run: ls -la build/libs/tornadic-1.0.0.jar

      - name: Remove stale failure log
        if: success()
        run: |
          set +e
          git config user.name "tornadic-ci"
          git config user.email "ci@tornadic.invalid"
          if [ -f ci-last-failure.log ]; then
            rm ci-last-failure.log
            git add -A ci-last-failure.log
          fi
          if ! git diff --cached --quiet; then
            git commit -m "ci: build fixed, drop diagnostic logs"
            git push
          fi
          exit 0

      - name: Commit failure log
        if: failure()
        run: |
          set +e
          git config user.name "tornadic-ci"
          git config user.email "ci@tornadic.invalid"
          [ -f ci-last-failure.log ] || echo "BUILD STEP DIED BEFORE CAPTURE" > ci-last-failure.log
          KEY=$(grep -E "error|Error|ERROR|FAILED|What went wrong|Exception" ci-last-failure.log | head -5 | tr '\n' '|' | head -c 150)
          git add -f ci-last-failure.log
          COMMITTED=0
          if ! git diff --cached --quiet; then
            if git commit -m "ci: last build failure log | ${KEY}"; then
              COMMITTED=1
            fi
          fi
          if [ "$COMMITTED" = "1" ]; then
            git push > /tmp/push.out 2>&1
            PUSH=$?
            echo "push-exit=$PUSH $(head -c 300 /tmp/push.out)"
            if [ "$PUSH" -ne 0 ]; then
              echo "PUSH_DENIED - log could not be committed"
              exit 1
            fi
          fi
          exit 0

      - name: Upload mod jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tornadic-1.0.0
          path: build/libs/tornadic-1.0.0.jar
